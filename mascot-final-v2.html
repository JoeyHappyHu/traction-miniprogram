<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共鸣星球 V2 - 定稿</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #FFF8F0;
  padding: 40px 20px;
  color: #2D2B3D;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.header {
  text-align: center;
  margin-bottom: 50px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, #B388FF, #FF7EB3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header p {
  font-size: 14px;
  color: #8B86A3;
}
.comparison {
  display: flex;
  gap: 60px;
  align-items: flex-start;
  margin-bottom: 60px;
}
.mascot-box {
  text-align: center;
}
.mascot-box .label {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #4A4766;
}
.mascot-box .label span {
  font-size: 13px;
  font-weight: 400;
  color: #8B86A3;
  display: block;
  margin-top: 4px;
}
.mascot-box .svg-wrap {
  width: 200px;
  height: 200px;
  margin: 0 auto;
}
.note {
  text-align: center;
  padding: 20px 30px;
  background: #F3E8FF;
  border-radius: 16px;
  max-width: 600px;
  margin-bottom: 40px;
}
.note p {
  font-size: 13px;
  color: #4A4766;
  line-height: 1.8;
}
.app-preview {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  justify-content: center;
}
.app-box {
  text-align: center;
}
.app-box .label {
  font-size: 13px;
  color: #8B86A3;
  margin-bottom: 12px;
}
.login-mockup {
  width: 280px;
  height: 500px;
  background: linear-gradient(180deg, #F3E8FF 0%, #FFF0F5 40%, #FFF8F0 100%);
  border-radius: 32px;
  box-shadow: 0 10px 40px rgba(179,136,255,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
}
.login-mockup h2 {
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #B388FF, #FF7EB3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: 20px;
  letter-spacing: 2px;
}
.login-mockup p {
  font-size: 12px;
  color: #8B86A3;
  margin-top: 6px;
  letter-spacing: 3px;
}
.login-mockup .btn {
  margin-top: auto;
  margin-bottom: 60px;
  width: 85%;
  padding: 14px;
  border-radius: 50px;
  border: none;
  background: #07C160;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  box-shadow: 0 4px 16px rgba(7,193,96,0.3);
}
.chat-mockup {
  width: 280px;
  height: 500px;
  background: var(--cream);
  border-radius: 32px;
  box-shadow: 0 10px 40px rgba(179,136,255,0.12);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.chat-mockup .msg-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.chat-mockup .msg-row.ai {
  align-self: flex-start;
}
.chat-mockup .msg-row.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.chat-mockup .msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
}
.chat-mockup .msg-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.6;
  max-width: 180px;
}
.chat-mockup .ai .msg-bubble {
  background: #fff;
  color: #2D2B3D;
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px rgba(179,136,255,0.08);
}
.chat-mockup .user .msg-bubble {
  background: linear-gradient(135deg, #B388FF, #FF7EB3);
  color: #fff;
  border-bottom-right-radius: 4px;
}
</style>
</head>
<body>

<div class="header">
  <h1>共鸣星球 V2 - 定稿</h1>
  <p>保留心形 | 无眼白 | 无高光 | 纯深色大眼 | 无嘴巴</p>
</div>

<div class="comparison">
  <div class="mascot-box">
    <div class="label">大尺寸展示<span>用于登录页mascot</span></div>
    <div class="svg-wrap">
      <svg viewBox="0 0 200 200" width="200" height="200">
        <path d="M30,55 Q25,35 45,25 Q60,18 75,28 Q90,18 100,35 Q108,52 95,70 Q80,90 60,100 Q40,90 25,70 Q18,55 30,55Z" fill="#FF7EB3" transform="translate(0,10)"/>
        <circle cx="55" cy="65" r="7" fill="#2D2B3D"/>
        <circle cx="85" cy="65" r="7" fill="#2D2B3D"/>
      </svg>
    </div>
  </div>

  <div class="mascot-box">
    <div class="label">小尺寸展示<span>用于对话头像/图标</span></div>
    <div class="svg-wrap" style="display:flex;gap:20px;align-items:end;">
      <div style="text-align:center;">
        <svg viewBox="0 0 60 60" width="60" height="60">
          <path d="M8,16 Q6,8 14,4 Q20,1 26,6 Q32,1 36,8 Q40,15 34,22 Q28,29 20,32 Q12,29 6,22 Q3,16 8,16Z" fill="#FF7EB3"/>
          <circle cx="18" cy="17" r="3" fill="#2D2B3D"/>
          <circle cx="26" cy="17" r="3" fill="#2D2B3D"/>
        </svg>
        <div style="font-size:11px;color:#8B86A3;margin-top:6px;">60px</div>
      </div>
      <div style="text-align:center;">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <path d="M5,11 Q4,5 9,3 Q13,1 17,4 Q21,1 24,5 Q26,10 22,15 Q19,19 14,21 Q9,19 5,15 Q3,11 5,11Z" fill="#FF7EB3"/>
          <circle cx="12" cy="11" r="2" fill="#2D2B3D"/>
          <circle cx="18" cy="11" r="2" fill="#2D2B3D"/>
        </svg>
        <div style="font-size:11px;color:#8B86A3;margin-top:6px;">40px</div>
      </div>
      <div style="text-align:center;">
        <svg viewBox="0 0 28 28" width="28" height="28">
          <path d="M4,8 Q3,4 7,2 Q10,1 13,3 Q16,1 18,4 Q20,7 16,11 Q13,14 10,15 Q7,14 4,11 Q2,8 4,8Z" fill="#FF7EB3"/>
          <circle cx="9" cy="8" r="1.5" fill="#2D2B3D"/>
          <circle cx="13" cy="8" r="1.5" fill="#2D2B3D"/>
        </svg>
        <div style="font-size:11px;color:#8B86A3;margin-top:6px;">28px</div>
      </div>
    </div>
  </div>
</div>

<div class="note">
  <p><strong>改动说明</strong>：基于"共鸣心球"方案 V3 — 保留原始心形外形；去掉深色阴影层；去掉眼白只保留深色大眼；去掉眼珠高光白点；去掉嘴巴。整体极简风格。</p>
</div>

<div class="app-preview">
  <div class="app-box">
    <div class="label">登录页效果</div>
    <div class="login-mockup">
      <svg viewBox="0 0 100 100" width="100" height="100">
        <path d="M15,28 Q12,14 28,8 Q40,4 50,12 Q60,4 72,10 Q82,18 78,32 Q72,46 58,54 Q44,62 28,54 Q14,46 15,28Z" fill="#FF7EB3"/>
        <circle cx="38" cy="28" r="5" fill="#2D2B3D"/>
        <circle cx="58" cy="28" r="5" fill="#2D2B3D"/>
      </svg>
      <h2>Traction</h2>
      <p>你的未来预演卡牌</p>
      <button class="btn">微信一键登录</button>
    </div>
  </div>

  <div class="app-box">
    <div class="label">对话页效果</div>
    <div class="chat-mockup">
      <div class="msg-row ai">
        <div class="msg-avatar">
          <svg viewBox="0 0 32 32" width="32" height="32">
            <path d="M5,11 Q3,5 10,2 Q15,0 20,4 Q25,0 29,5 Q31,10 27,16 Q23,22 16,24 Q9,22 5,16 Q3,11 5,11Z" fill="#FF7EB3"/>
            <circle cx="12" cy="11" r="2.5" fill="#2D2B3D"/>
            <circle cx="20" cy="11" r="2.5" fill="#2D2B3D"/>
          </svg>
        </div>
        <div class="msg-bubble">现在聊聊你的想法吧</div>
      </div>
      <div class="msg-row user">
        <div class="msg-bubble">我想了解出国读研</div>
      </div>
      <div class="msg-row ai">
        <div class="msg-avatar">
          <svg viewBox="0 0 32 32" width="32" height="32">
            <path d="M5,11 Q3,5 10,2 Q15,0 20,4 Q25,0 29,5 Q31,10 27,16 Q23,22 16,24 Q9,22 5,16 Q3,11 5,11Z" fill="#FF7EB3"/>
            <circle cx="12" cy="11" r="2.5" fill="#2D2B3D"/>
            <circle cx="20" cy="11" r="2.5" fill="#2D2B3D"/>
          </svg>
        </div>
        <div class="msg-bubble">为什么想出国呢</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
